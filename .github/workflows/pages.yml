name: Publish application
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Unpack browser application
        run: |
          mkdir _site
          unzip -q github-pages-app.zip -d _site
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/runtime/ort-asyncify.part0
          if find _site -type f \( -name '*.tsx' -o -name '*.ts' -o -name '*.map' -o -name '.env*' \) | grep -q .; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
